appId: app.zonacero.mobile
name: Visual audit access smoke
---
- launchApp
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          point: "50%,22%"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "live-operational-entry"
    timeout: 30000
- assertVisible: "Live operational entry"
- tapOn:
    id: "open-visual-audit"
- assertVisible: "Visual audit: mock-backed operational-map"
- assertVisible: "Available"
- assertNotVisible: "North triage point"
- openLink: "zonacero://visual-audit?screen=operational-map&theme=night"
- assertVisible: "Visual audit: mock-backed operational-map"
- assertVisible: "Available"
- openLink: "zonacero://visual-audit?screen=selected-center&theme=day"
- assertVisible: "Visual audit: mock-backed selected-center"
- assertVisible: "Escuela Norte"
- openLink: "zonacero://visual-audit?screen=selected-center&theme=night"
- assertVisible: "Visual audit: mock-backed selected-center"
- assertVisible: "Escuela Norte"
- openLink: "zonacero://visual-audit?screen=sos-outbox&theme=day"
- assertVisible: "Visual audit: mock-backed sos-outbox"
- assertVisible: "SOS raised"
- openLink: "zonacero://visual-audit?screen=sos-outbox&theme=night"
- assertVisible: "Visual audit: mock-backed sos-outbox"
- assertVisible: "SOS raised"
